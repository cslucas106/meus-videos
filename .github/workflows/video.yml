# Gera um vídeo a partir de videos/<nome>/pedido.json (imagens de fundo em videos/<nome>/fundos/).
# Quem dispara é o PocketCode AI (ou você, na aba Actions > Gerar vídeo > Run workflow).
# Não usa nenhuma chave secreta: a voz do Edge é grátis e o Release usa o token
# automático do próprio GitHub Actions, que só vale para este repositório.
name: Gerar vídeo

on:
  # Ao mudar o modelo (cenas, scripts, este workflow), gera o videos/exemplo/pedido.json como teste.
  # Nesse caso o vídeo fica só nos "Artifacts" da execução (7 dias), sem Release.
  push:
    branches: [main]
    paths:
      - 'motor/**'
      - 'videos/exemplo/**'
      - '.github/workflows/video.yml'
  workflow_dispatch:
    inputs:
      pedido:
        description: 'Nome do pedido (a pasta videos/<nome>/)'
        required: true
      modo:
        description: 'video = o vídeo inteiro; storyboard = só uma foto de cada cena e a narração, para conferir antes'
        required: false
        default: video
        type: choice
        options: [video, storyboard]

permissions:
  contents: write

concurrency:
  group: video-${{ github.event.inputs.pedido || 'exemplo' }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PEDIDO: ${{ github.event.inputs.pedido || 'exemplo' }}
      MODO: ${{ github.event.inputs.modo || 'video' }}
    # o código (scripts, cenas do Remotion, package.json) fica em motor/; os pedidos em ../videos/
    defaults:
      run:
        working-directory: motor
    steps:
      - name: Confere o nome do pedido
        working-directory: .
        run: |
          if [[ ! "$PEDIDO" =~ ^[a-z0-9][a-z0-9-]{0,59}$ ]]; then
            echo "::error::Nome inválido. Use só letras minúsculas, números e hífen."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motor/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala as ferramentas
        timeout-minutes: 10
        run: |
          bash scripts/instala.sh edge-tts==7.3.1 "numpy>=2,<3"
          npm ci --no-audit --no-fund

      - name: 1/4 Confere os números do roteiro
        run: |
          ARQ="../videos/$PEDIDO/pedido.json"
          # app antigo (antes da 1.7.0) ainda grava em pedidos/<nome>.json
          [ -f "$ARQ" ] || ARQ="../pedidos/$PEDIDO.json"
          node scripts/verifica.mjs "$ARQ" out/pedido.json
          # imagens de fundo do pedido (videos/<nome>/fundos/fundo-N.jpg) e fotos do Commons que o app já baixou (foto-N.jpg), se houver
          mkdir -p public/fundos
          for d in "../videos/$PEDIDO/fundos" "../pedidos/$PEDIDO"; do
            [ -d "$d" ] && cp "$d"/fundo-* "$d"/foto-* public/fundos/ 2>/dev/null || true
          done
          # sons de ambiente do Freesound que o app baixou (videos/<nome>/sons/som-N.mp3): o juntar.py mistura na cena
          mkdir -p out/sons
          [ -d "../videos/$PEDIDO/sons" ] && cp "../videos/$PEDIDO/sons"/som-* out/sons/ 2>/dev/null || true
          # fotos do Wikimedia Commons (cena.foto) que o app não mandou: baixadas aqui, com o crédito guardado no pedido
          node scripts/fotos.mjs out/pedido.json public/fundos
          # mapa de municípios (dados com "mun"): contorno das malhas do IBGE, guardado na própria cena
          node scripts/malhas.mjs out/pedido.json

      - name: 2/4 Gera a narração
        run: python scripts/narrar.py out/pedido.json out

      # Storyboard: uma foto de cada cena + a narração, num Release storyboard-<nome>-<execução> (o app mostra e pergunta se gera o vídeo)
      - name: "Storyboard: uma foto de cada cena"
        if: env.MODO == 'storyboard'
        run: node scripts/storyboard.mjs out/props.json out/storyboard

      - name: Publica o storyboard
        if: env.MODO == 'storyboard' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="storyboard-$PEDIDO-$GITHUB_RUN_NUMBER"
          TITULO=$(node -e "console.log('Storyboard: ' + JSON.parse(require('fs').readFileSync('out/pedido.json','utf8')).titulo)")
          # o storyboard anterior do mesmo pedido não serve mais
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep "^storyboard-$PEDIDO-[0-9]*$" || true); do
            gh release delete "$t" --yes --cleanup-tag || true
          done
          gh release create "$TAG" out/storyboard/*.jpg out/narracao.mp3 \
            --title "$TITULO" --notes-file out/storyboard/notas.md --target "$GITHUB_SHA" --prerelease
          echo "### Storyboard: [$TITULO](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: 3/4 Desenha as cenas (Remotion)
        if: env.MODO != 'storyboard'
        run: npx remotion render src/index.jsx Video out/video-sem-audio.mp4 --props=out/props.json

      - name: 4/4 Junta vídeo, voz e trilha
        if: env.MODO != 'storyboard'
        run: python scripts/juntar.py out

      # Kit para postar: a capa é uma foto da abertura (sem legenda). Se falhar, o vídeo sai do mesmo jeito.
      - name: Capa do vídeo
        if: env.MODO != 'storyboard'
        continue-on-error: true
        run: |
          QUADRO=$(node scripts/capa.mjs out/props.json out/props-capa.json)
          npx remotion still src/index.jsx Video out/capa.jpg --props=out/props-capa.json \
            --frame="$QUADRO" --image-format=jpeg --jpeg-quality=90

      - name: Guarda o vídeo de teste
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: video-de-teste
          path: |
            motor/out/video.mp4
            motor/out/video-sem-audio.mp4
            motor/out/narracao.mp3
            motor/out/legendas.srt
            motor/out/trilha.mp3
            motor/out/capa.jpg
            motor/out/post.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publica no Release
        if: github.event_name == 'workflow_dispatch' && env.MODO != 'storyboard'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$PEDIDO-$GITHUB_RUN_NUMBER"
          TITULO=$(node -e "console.log(JSON.parse(require('fs').readFileSync('out/pedido.json','utf8')).titulo)")
          ARQS="out/video.mp4 out/video-sem-audio.mp4 out/narracao.mp3 out/legendas.srt"
          [ -f out/trilha.mp3 ] && ARQS="$ARQS out/trilha.mp3"
          [ -f out/capa.jpg ] && ARQS="$ARQS out/capa.jpg"
          [ -f out/post.txt ] && ARQS="$ARQS out/post.txt"
          gh release create "$TAG" $ARQS \
            --title "$TITULO" --notes-file out/notas.md --target "$GITHUB_SHA"
          echo "### Pronto: [$TITULO](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # O LEIAME.md da pasta ganha o link desta versão. Se não der para gravar, o vídeo continua pronto no Release.
      - name: Atualiza o LEIAME.md
        if: github.event_name == 'workflow_dispatch' && env.MODO != 'storyboard' && hashFiles(format('videos/{0}/pedido.json', env.PEDIDO)) != ''
        continue-on-error: true
        run: bash scripts/grava-leiame.sh "videos/$PEDIDO" "$TAG"

      # Limpeza: o storyboard deste vídeo (já virou vídeo) e os storyboards de mais de 3 dias que ninguém aprovou.
      # Se falhar, não faz mal: o vídeo já está pronto.
      - name: Apaga storyboards velhos
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMITE=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 100 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"storyboard-\")) | select((.tagName | test(\"^storyboard-$PEDIDO-[0-9]+$\")) and \"$MODO\" == \"video\" or .createdAt < \"$LIMITE\") | .tagName" |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
