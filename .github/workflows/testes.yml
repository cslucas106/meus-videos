name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # inclui tests/estrutura.test.mjs: confere as pastas videos/, audios/ e imagens/ e todos os pedidos de vídeo
      - run: node --test tests/*.test.mjs
        working-directory: motor
