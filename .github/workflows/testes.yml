name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Confere todos os pedidos
        run: |
          for p in pedidos/*.json; do
            grep -q '"tipo": *"voz"' "$p" && continue  # narração solta não tem tabela
            node scripts/verifica.mjs "$p"
          done
