# Só a narração: audios/<nome>/pedido.json com "tipo": "voz" vira narracao.mp3 + legendas.srt num Release.
# Quem dispara é o modo Mídia do PocketCode AI. Não usa chave secreta.
name: Gerar narração

on:
  workflow_dispatch:
    inputs:
      pedido:
        description: 'Nome do pedido (a pasta audios/<nome>/)'
        required: true

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEDIDO: ${{ github.event.inputs.pedido }}
    # o código fica em motor/; os pedidos em ../audios/
    defaults:
      run:
        working-directory: motor
    steps:
      - name: Confere o nome do pedido
        working-directory: .
        run: |
          if [[ ! "$PEDIDO" =~ ^[a-z0-9][a-z0-9-]{0,59}$ ]]; then
            echo "::error::Nome inválido. Use só letras minúsculas, números e hífen."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala as ferramentas
        timeout-minutes: 9
        run: bash scripts/instala.sh edge-tts==7.3.1

      - name: Gera a narração
        run: |
          ARQ="../audios/$PEDIDO/pedido.json"
          # app antigo (antes da 1.7.0) ainda grava em pedidos/<nome>.json
          [ -f "$ARQ" ] || ARQ="../pedidos/$PEDIDO.json"
          echo "ARQ=$ARQ" >> "$GITHUB_ENV"
          python scripts/narrar.py "$ARQ" out

      - name: Publica no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voz-$PEDIDO-$GITHUB_RUN_NUMBER"
          TITULO=$(python -c "import json,os;print(json.load(open(os.environ['ARQ']))['titulo'])")
          gh release create "$TAG" out/narracao.mp3 out/legendas.srt \
            --title "🎙️ $TITULO" --notes-file out/notas.md --target "$GITHUB_SHA"
          echo "### Pronto: [$TITULO](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: hashFiles(format('audios/{0}/pedido.json', env.PEDIDO)) != ''
        with:
          node-version: 22

      # O LEIAME.md da pasta ganha o link desta narração. Se não der para gravar, a narração continua pronta no Release.
      - name: Atualiza o LEIAME.md
        if: hashFiles(format('audios/{0}/pedido.json', env.PEDIDO)) != ''
        continue-on-error: true
        run: bash scripts/grava-leiame.sh "audios/$PEDIDO" "$TAG"
